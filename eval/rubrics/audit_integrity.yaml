# Hrz5 audit-integrity rubric — the WORM promotion bar (rule R2 / P-08).
# The offline gate (eval/run_eval.py) drives the local SQLite WORM stand-in and checks
# that the immutable trail round-trips without loss. All thresholds are 1.00: an audit
# store that loses or mutates a record is not fit for a regulated deployment.
metric: write_read_parity
threshold: 1.00
description: >
  Every written AuditEvent must read back field-for-field (action, actor, decision,
  redacted prompt/response, trace id, citation source ids). No silent loss or mutation.
companion_metrics:
  citation_provenance:
    threshold: 1.00
    description: >
      Stored citations retain their source id set and page-level provenance, so an
      auditor can trace a stored answer back to the exact regulatory page.
  redaction_preserved:
    threshold: 1.00
    description: >
      Only redacted_* fields are stored; the schema has no raw-PII column (rule R1,
      P-04). Hrz5 never redacts, it serialises and stores already-redacted text.
  newest_first_order:
    threshold: 1.00
    description: >
      Read-back is newest-first and append-only: the store exposes no update or delete
      path, emulating the locked-bucket WORM guarantee within the process.
