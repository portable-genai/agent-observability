name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: lint + test (offline, local profile)
    runs-on: ubuntu-latest
    env:
      # Dev / test default profile: the SDK-free local stack. `onprem` would fail fast;
      # production uses `gcp`.
      OBSERVABILITY_PROFILE: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      # Locked, reproducible install: the committed lockfile pins every transitive dep;
      # install the package itself with --no-deps so the lock stays authoritative. The
      # [gcp] extra is deliberately NOT installed; tests must pass with no Google Cloud SDKs.
      - name: Install (locked, no Google Cloud SDKs)
        run: pip install -r requirements-dev.lock && pip install -e . --no-deps

      - name: Ruff lint
        run: ruff check src tests eval scripts

      - name: Ruff format check
        run: ruff format --check src tests eval scripts

      - name: mypy
        run: mypy src

      - name: Pytest (must pass with no GCP SDKs installed)
        run: pytest -m 'not integration' -q

      - name: Eval gate (offline audit-integrity, rule R2)
        run: python eval/run_eval.py

      - name: Demo self-test (assert every live step)
        run: make demo-selftest

      - name: Bounded portability proof
        run: make portability-demo

      - name: Applied fork rename (fresh locked full gate)
        run: make rename-selftest

  terraform:
    name: terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.9.0"

      - name: terraform fmt check
        run: terraform -chdir=infra/terraform fmt -check -recursive

      - name: terraform init (no backend)
        run: terraform -chdir=infra/terraform init -backend=false

      - name: terraform validate
        run: terraform -chdir=infra/terraform validate

  supply-chain:
    name: dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      # Audit the committed lockfiles so the result matches exactly what CI and the
      # container image install. --no-deps: the locks are fully compiled (every
      # transitive dep pinned), so audit those versions without re-resolving.
      - name: pip-audit (dev + gcp lockfiles)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements-dev.lock --disable-pip --no-deps
          pip-audit -r requirements-gcp.lock --disable-pip --no-deps
