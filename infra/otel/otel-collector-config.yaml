# OpenTelemetry Collector config for catalog system Hrz5 (Agent Observability).
#
# Telemetry ingest is INFRA, not part of the Hrz5 HTTP contract (SPEC §6). Agents export
# OTLP traces, metrics, and logs to this collector. The portable OpenTelemetry contract
# is deliberately vendor neutral; only the exporter below is GCP-specific.
#
# The span attribute `trace_id` that agents emit is the SAME value stored on the
# AuditEvent (`trace_id` field), so an auditor can pivot from an immutable audit record
# straight to its full reasoning trace.
#
# Run: otelcol-contrib --config infra/otel/otel-collector-config.yaml
# (the googlecloud exporter ships in the contrib distribution).

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Bound memory under load.
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100
  # Sample every trace by default. Lower this only after production volume and incident
  # requirements are understood; errors and audit events travel through separate logs.
  probabilistic_sampler:
    sampling_percentage: 100
  # Never export common prompt, response, user, token, or credential attributes. Agent
  # instrumentation should avoid capturing content in the first place; this is the
  # collector-side defence in depth.
  attributes/redact:
    actions:
      - key: gen_ai.prompt
        action: delete
      - key: gen_ai.completion
        action: delete
      - key: gen_ai.request.prompt
        action: delete
      - key: gen_ai.response.text
        action: delete
      - key: input.value
        action: delete
      - key: output.value
        action: delete
      - key: enduser.id
        action: delete
      - key: user.email
        action: delete
      - key: authorization
        action: delete
      - key: http.request.header.authorization
        action: delete
  # Current GenAI semantic-convention content can appear on spans, span events, or log
  # bodies. Remove it at every context and replace arbitrary log bodies with a marker.
  # Structural attributes such as agent/model names, token counts, latency, status, and
  # trace correlation remain available for operations.
  transform/redact_content:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - delete_key(attributes, "gen_ai.input.messages")
          - delete_key(attributes, "gen_ai.output.messages")
          - delete_key(attributes, "gen_ai.system_instructions")
          - delete_key(attributes, "gen_ai.tool.definitions")
          - delete_key(attributes, "gen_ai.tool.call.arguments")
          - delete_key(attributes, "gen_ai.tool.call.result")
      - context: spanevent
        statements:
          - delete_key(attributes, "gen_ai.input.messages")
          - delete_key(attributes, "gen_ai.output.messages")
          - delete_key(attributes, "gen_ai.system_instructions")
          - delete_key(attributes, "gen_ai.tool.definitions")
          - delete_key(attributes, "gen_ai.tool.call.arguments")
          - delete_key(attributes, "gen_ai.tool.call.result")
          - delete_key(attributes, "input.value")
          - delete_key(attributes, "output.value")
    log_statements:
      - context: log
        statements:
          - set(body, "[CONTENT REDACTED]") where body != nil
          - delete_key(attributes, "gen_ai.input.messages")
          - delete_key(attributes, "gen_ai.output.messages")
          - delete_key(attributes, "gen_ai.system_instructions")
          - delete_key(attributes, "gen_ai.tool.definitions")
          - delete_key(attributes, "gen_ai.tool.call.arguments")
          - delete_key(attributes, "gen_ai.tool.call.result")
          - delete_key(attributes, "input.value")
          - delete_key(attributes, "output.value")
  # Batch before export for efficiency.
  batch:
    send_batch_size: 512
    timeout: 5s
  # Stamp the configured deployment region and system identity.
  resource:
    attributes:
      - key: cloud.region
        value: ${env:GCP_REGION}
        action: upsert
      - key: catalog.system
        value: Hrz5
        action: upsert

exporters:
  # Cloud Trace, Monitoring, and Logging. The sending queue absorbs transient backend
  # failures; persistent failures surface through the collector's own telemetry.
  #
  # NO retry_on_failure block: the googlecloud exporter does not accept one, and supplying it
  # is not ignored — the collector refuses the whole configuration with
  # "'' has invalid keys: retry_on_failure" and the container never binds its port. That is
  # exactly how this shipped, so the OTLP ingest service could not start at all; found on the
  # first real apply, 2026-08-24, and confirmed by running the image against this file with
  # and without the block. The exporter retries internally; the queue is the tunable part.
  googlecloud:
    project: ${env:GOOGLE_CLOUD_PROJECT}
    sending_queue:
      enabled: true
      queue_size: 2048
      num_consumers: 10
  # Uncomment for local debugging:
  # debug:
  #   verbosity: detailed

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, probabilistic_sampler, attributes/redact, transform/redact_content, resource, batch]
      exporters: [googlecloud]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, transform/redact_content, resource, batch]
      exporters: [googlecloud]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, transform/redact_content, resource, batch]
      exporters: [googlecloud]
